<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akash Maths Online - Smart Board Classroom Viewer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body { background-color: #0B132B; overflow: hidden; user-select: none; }
        .slide-container {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }
        /* Side Hover Zones for Slide Navigation */
        .hover-zone-left, .hover-zone-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 90px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            cursor: pointer;
        }
        .hover-zone-left { left: 0; background: linear-gradient(to right, rgba(0,0,0,0.25), transparent); }
        .hover-zone-right { right: 0; background: linear-gradient(to left, rgba(0,0,0,0.25), transparent); }
        .slide-container:hover .hover-zone-left, .slide-container:hover .hover-zone-right {
            opacity: 1;
        }
        .nav-arrow-btn {
            background: rgba(255, 255, 255, 0.9);
            color: #1E293B;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            font-size: 26px;
            font-weight: bold;
            transition: transform 0.15s;
        }
        .nav-arrow-btn:hover { transform: scale(1.1); background: #ffffff; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between p-2.5 select-none">

    <!-- TOP HEADER BAR -->
    <header class="flex justify-between items-center px-4 py-2 bg-[#1C2541] text-white rounded-xl shadow-lg z-40 border border-white/10">
        <div class="flex items-center space-x-3">
            <a href="https://akashmathsonline.github.io/" class="bg-[#3A506B] hover:bg-[#475C7D] px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow">
                ← Chapter Hub
            </a>
            <h1 class="text-base font-semibold tracking-wide text-gray-100">Class 9 Mathematics - Smart Board Studio</h1>
        </div>
        <div class="flex items-center space-x-3 text-sm">
            <button onclick="zoomOut()" class="bg-[#3A506B] hover:bg-[#475C7D] px-2.5 py-1 rounded-md text-white font-bold" title="Zoom Out">−</button>
            <span id="slideCounterDisplay" class="bg-[#3A506B] px-3 py-1 rounded-md text-gray-100 font-mono font-medium">Slide 01 / --</span>
            <button onclick="zoomIn()" class="bg-[#3A506B] hover:bg-[#475C7D] px-2.5 py-1 rounded-md text-white font-bold" title="Zoom In">+</button>
        </div>
    </header>

    <!-- MAIN PRESENTATION AREA -->
    <main class="flex-1 flex items-center justify-center relative my-1.5 overflow-hidden">
        
        <!-- Central White Box Container (Optimized for Large Classroom View) -->
        <div id="slideWrapper" class="slide-container relative bg-white w-[95%] h-[95%] rounded-2xl overflow-hidden flex items-center justify-center">
            
            <!-- PDF Canvas Viewer -->
            <canvas id="pdfCanvas" class="max-w-full max-h-full object-contain"></canvas>

            <!-- Annotation Drawing Canvas Overlay -->
            <canvas id="drawCanvas" class="absolute inset-0 z-20 cursor-crosshair pointer-events-none"></canvas>

            <!-- Left Hover Zone (Previous Slide) -->
            <div id="hoverPrev" class="hover-zone-left" title="Previous Slide">
                <div class="nav-arrow-btn">&#10094;</div>
            </div>

            <!-- Right Hover Zone (Next Slide) -->
            <div id="hoverNext" class="hover-zone-right" title="Next Slide">
                <div class="nav-arrow-btn">&#10095;</div>
            </div>

        </div>

        <!-- RIGHT FLOATING SMART BOARD TOOLBAR (Restored All Tools & Colors) -->
        <aside class="absolute right-3 top-1/2 -translate-y-1/2 bg-[#1C2541]/95 backdrop-blur-md p-2 rounded-2xl shadow-2xl flex flex-col items-center space-y-2 z-40 border border-white/15">
            <button id="toolPen" onclick="setTool('pen')" class="p-2.5 rounded-xl bg-blue-600 text-white hover:bg-blue-500 transition shadow" title="Pen (Blue)">✏️</button>
            <button id="toolHighlighter" onclick="setTool('highlighter')" class="p-2.5 rounded-xl bg-gray-700 text-white hover:bg-gray-600 transition" title="Highlighter">🖍️</button>
            <button id="toolEraser" onclick="setTool('eraser')" class="p-2.5 rounded-xl bg-gray-700 text-white hover:bg-gray-600 transition" title="Eraser">🧹</button>
            
            <div class="w-6 h-[1px] bg-white/20 my-0.5"></div>
            
            <!-- Color Palette for Teaching -->
            <button onclick="setPenColor('#2563EB')" class="w-6 h-6 rounded-full bg-blue-600 border-2 border-white shadow" title="Blue Pen"></button>
            <button onclick="setPenColor('#DC2626')" class="w-6 h-6 rounded-full bg-red-600 border-2 border-white shadow" title="Red Pen"></button>
            <button onclick="setPenColor('#16A34A')" class="w-6 h-6 rounded-full bg-green-600 border-2 border-white shadow" title="Green Pen"></button>
            <button onclick="setPenColor('#000000')" class="w-6 h-6 rounded-full bg-black border-2 border-white shadow" title="Black Pen"></button>

            <div class="w-6 h-[1px] bg-white/20 my-0.5"></div>
            <button onclick="clearCanvas()" class="p-2 rounded-xl bg-red-600/80 text-white hover:bg-red-500 transition text-xs" title="Clear Screen">🗑️</button>
            <div class="w-6 h-[1px] bg-white/20 my-0.5"></div>
            <button onclick="downloadPDF()" class="p-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition text-xs" title="Download PDF">📥</button>
        </aside>

    </main>

    <!-- BOTTOM BRANDING FOOTER -->
    <footer class="flex justify-between items-center px-4 py-1 text-xs text-gray-300 z-40 font-medium">
        <div>Ganita Manjari (Grade 9) • NCERT Aligned</div>
        <div class="text-cyan-300 tracking-wide">Akash Maths Online (www.akashmaths.online)</div>
        <div id="footerSlideNo">Slide 1</div>
    </footer>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const pdfUrl = 'maths-ch1.pdf.pdf';

        let pdfDoc = null,
            pageNum = 1,
            pageRendering = false,
            pageNumPending = null,
            scale = 1.35, // Optimized for Big Smart Board Clarity
            currentTool = 'pen',
            penColor = '#2563EB';

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d');

        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdfDoc_) {
            pdfDoc = pdfDoc_;
            document.getElementById('slideCounterDisplay').textContent = `Slide 01 / ${pdfDoc.numPages}`;
            renderPage(pageNum);
        }).catch(err => {
            console.error(err);
            alert("PDF लोड करने में विफल! कृपया फाइल का नाम चेक करें।");
        });

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                var viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                drawCanvas.height = viewport.height;
                drawCanvas.width = viewport.width;

                var renderContext = { canvasContext: ctx, viewport: viewport };
                var renderTask = page.render(renderContext);

                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('slideCounterDisplay').textContent = `Slide ${String(num).padStart(2, '0')} / ${pdfDoc.numPages}`;
            document.getElementById('footerSlideNo').textContent = `Slide ${num} of ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) { pageNumPending = num; } else { renderPage(num); }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            clearCanvas();
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            clearCanvas();
            queueRenderPage(pageNum);
        }

        function zoomIn() {
            scale += 0.15;
            renderPage(pageNum);
        }

        function zoomOut() {
            if (scale > 0.8) {
                scale -= 0.15;
                renderPage(pageNum);
            }
        }

        document.getElementById('hoverPrev').addEventListener('click', onPrevPage);
        document.getElementById('hoverNext').addEventListener('click', onNextPage);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') onPrevPage();
            if (e.key === 'ArrowRight') onNextPage();
        });

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        drawCanvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });

        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing) return;
            drawCtx.beginPath();
            drawCtx.moveTo(lastX, lastY);
            drawCtx.lineTo(e.offsetX, e.offsetY);
            
            if (currentTool === 'pen') {
                drawCtx.strokeStyle = penColor;
                drawCtx.lineWidth = 3.5;
                drawCtx.globalAlpha = 1.0;
            } else if (currentTool === 'highlighter') {
                drawCtx.strokeStyle = '#FACC15';
                drawCtx.lineWidth = 20;
                drawCtx.globalAlpha = 0.35;
            } else if (currentTool === 'eraser') {
                drawCtx.strokeStyle = '#FFFFFF';
                drawCtx.lineWidth = 30;
                drawCtx.globalAlpha = 1.0;
            }
            
            drawCtx.lineCap = 'round';
            drawCtx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        });

        window.addEventListener('mouseup', () => isDrawing = false);

        function setTool(tool) {
            currentTool = tool;
            drawCanvas.style.pointerEvents = 'auto';
            document.querySelectorAll('aside button').forEach(b => b.classList.remove('ring-4', 'ring-white/60'));
            if(tool === 'pen') document.getElementById('toolPen').classList.add('ring-4', 'ring-white/60');
            if(tool === 'highlighter') document.getElementById('toolHighlighter').classList.add('ring-4', 'ring-white/60');
            if(tool === 'eraser') document.getElementById('toolEraser').classList.add('ring-4', 'ring-white/60');
        }

        function setPenColor(color) {
            penColor = color;
            setTool('pen');
        }

        function clearCanvas() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        function downloadPDF() {
            window.open(pdfUrl, '_blank');
        }
    </script>
</body>
</html>
